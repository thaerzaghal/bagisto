name: Platform Tests

# TASK-ARCH-017A. Manual/on-demand only, deliberately - NOT [push,
# pull_request]. This project is on a GitHub Free plan; the full Platform
# integration suite and the production-config smoke suite are both
# real-MySQL(+Redis), multi-minute jobs, and running them automatically on
# every ordinary push/PR would consume Actions minutes for no benefit over
# the local commands documented in docs/implementation/ci-testing.md (which
# remain the PRIMARY verification loop - see that file's "Local developer
# commands"). This workflow exists for deliberate milestone verification
# (before a release, after a significant Platform change) via the Actions
# tab's "Run workflow" button, not as a per-commit gate. Kept simple (no
# inputs, no job selection) rather than adding a chooser between full/smoke/
# both - both jobs always run together on dispatch; there was no clear
# benefit found to selective triggering for a manually-invoked workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

# INCIDENT-001 (RISK_REGISTER.md R44, docs/incidents/INCIDENT-001-central-db-wipe.md).
# Neither job below ever runs `php artisan bagisto:install`, `migrate`,
# `migrate:fresh`, or `db:wipe`. Central bootstrap uses only the supported
# Platform workflow (`platform:migrate:central` + `platform:plans:seed`),
# and both jobs' MySQL service databases use the disposable
# `bagisto_ci_*`/`bagisto_test_*`/`bagisto_probe_*` naming convention
# Platform\Tenancy\Services\CentralDatabaseWipeGuard requires - neither job's
# database is ever literally `bagisto_central`, so the guard leaves both
# fully wipeable/migratable by the tests themselves, without ever protecting
# (or needing to protect) a CI-local database.

jobs:
  # Lane B: the full Platform integration suite (tests/Feature/Platform),
  # under this project's default phpunit.xml <php> block (CACHE_STORE=array,
  # QUEUE_CONNECTION=sync, SESSION_DRIVER=array - matching every other Pest
  # suite in this repository; the production-INTENDED values are Lane C's
  # job, not this one's).
  platform_tests:
    runs-on: ubuntu-latest

    name: Platform Feature Test suite (PHP 8.3)

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bagisto_ci_platform
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2

      - name: Running Composer Install
        run: composer install

      # Disposable, ephemeral GitHub Actions service container database -
      # see this file's own top-level comment for why the name must stay
      # bagisto_ci_-prefixed rather than bagisto_central.
      #
      # TASK-ARCH-017A fix: DB_PROVISION_USERNAME/DB_PROVISION_PASSWORD were
      # missing here entirely, which is what actually broke the smoke lane
      # (this job's own tenant provisioning uses them too, just wasn't
      # exercised by a failure until Lane C's smoke tests hit it first -
      # config/database.php's "tenant_provisioning" connection needs elevated
      # CREATE DATABASE/CREATE USER privileges; .env.example intentionally
      # leaves these blank, and Laravel's env() does not fall back to
      # DB_USERNAME/DB_PASSWORD for a key that is explicitly present but
      # empty, only for one that is truly unset). Reusing this job's own
      # MySQL service root credentials (declared two lines above, already
      # not a secret - the whole service container is thrown away when the
      # job ends) is exactly the "CI-local MySQL service configuration, no
      # real/local secrets" TASK-ARCH-017A asked for.
      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${{ job.services.mysql.ports['3306'] }}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1bagisto_ci_platform|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PROVISION_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PROVISION_PASSWORD=\s*\).*$|\1root|" .env
          cat .env

      - name: Generating Application Key
        run: php artisan key:generate

      # Supported Platform bootstrap sequence only (docs/implementation/ci-testing.md).
      # Never bagisto:install/migrate/migrate:fresh/db:wipe.
      - name: Marking Platform As Installed
        run: php artisan platform:mark-installed

      - name: Running Central Platform Migrations
        run: php artisan platform:migrate:central

      - name: Seeding Platform Plans
        run: php artisan platform:plans:seed

      # Deliberately NOT --parallel: real MySQL tenant-database creation/
      # migration, shared central fixtures, and dynamic per-tenant MySQL
      # users are not proven parallel-safe (see docs/implementation/
      # ci-testing.md "Parallelism" and RISK_REGISTER.md). Weakening this
      # for CI speed was explicitly rejected.
      - name: Running Platform Feature Test Suite
        run: vendor/bin/pest --colors=always --testsuite="Platform Feature Test"

  # Lane C: the production-configuration smoke lane - a small, separate
  # PHPUnit config (phpunit.smoke.xml) whose <php> block sets this project's
  # actual production-intended values (SESSION_DRIVER=database,
  # CACHE_STORE=redis, QUEUE_CONNECTION=redis, RESPONSE_CACHE_ENABLED=false)
  # rather than phpunit.xml's array/sync/array test defaults - the exact
  # class of masking that let R29/R33 hide (see phpunit.smoke.xml's own
  # docblock). Needs a real Redis service; Lane B does not.
  platform_smoke_tests:
    runs-on: ubuntu-latest

    name: Platform Production-Config Smoke suite (PHP 8.3)

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bagisto_ci_smoke
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:alpine
        ports:
          - 6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2

      - name: Running Composer Install
        run: composer install

      # DB_DATABASE/REDIS_HOST/REDIS_PORT are what a normal `php artisan`
      # invocation (e.g. this job's bootstrap steps below) sees. The actual
      # production-INTENDED SESSION_DRIVER/CACHE_STORE/QUEUE_CONNECTION/
      # RESPONSE_CACHE_ENABLED values come from phpunit.smoke.xml's own
      # <php> block, not from this .env - deliberately, so the bootstrap
      # steps below (which don't go through PHPUnit) still run against a
      # disposable, ordinary-config database, and only the smoke TEST
      # PROCESS itself exercises the production-intended values.
      # TASK-ARCH-017A fix: see Lane B's own "Setting Environment" step
      # comment - the same DB_PROVISION_USERNAME/DB_PROVISION_PASSWORD gap
      # is what actually broke this lane (every one of its 9 tests failed
      # identically on tenant provisioning's "Access denied for user
      # ''@..." before even reaching a real assertion).
      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${{ job.services.mysql.ports['3306'] }}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1bagisto_ci_smoke|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PROVISION_USERNAME=\s*\).*$|\1root|" .env
          sed -i "s|^\(DB_PROVISION_PASSWORD=\s*\).*$|\1root|" .env
          sed -i "s|^\(REDIS_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(REDIS_PORT=\s*\).*$|\1${{ job.services.redis.ports['6379'] }}|" .env
          sed -i "s|^\(REDIS_CLIENT=\s*\).*$|\1predis|" .env
          cat .env

      - name: Generating Application Key
        run: php artisan key:generate

      - name: Marking Platform As Installed
        run: php artisan platform:mark-installed

      - name: Running Central Platform Migrations
        run: php artisan platform:migrate:central

      - name: Seeding Platform Plans
        run: php artisan platform:plans:seed

      # phpunit.smoke.xml's own <php> block supplies the production-intended
      # overrides - this is the only correct way to invoke this lane (see
      # that file's own docblock for why `vendor/bin/pest tests/Feature/
      # PlatformSmoke` alone, without `-c phpunit.smoke.xml`, would silently
      # run under phpunit.xml's array/sync/array test defaults instead).
      - name: Running Platform Production-Config Smoke Suite
        run: vendor/bin/pest --colors=always -c phpunit.smoke.xml
