# TASK-MVP-004B. Standard Laravel nginx+php-fpm split. This container only
# ever binds to 127.0.0.1:8090 at the docker-compose level (see
# docker-compose.production.yml) - it is never reachable directly from the
# internet. aaPanel/Apache is the actual public TLS terminator/reverse
# proxy in front of this; the X-Forwarded-* headers it sends are passed
# through untouched here so Laravel's own TRUSTED_PROXIES-gated logic
# (bootstrap/app.php, TASK-MVP-004A) is what actually decides whether to
# trust them - this file does not attempt to re-implement that decision.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;

    # Preserve whatever Host/X-Forwarded-* headers arrived from upstream
    # (aaPanel/Apache) - never overwritten here, so Laravel's tenant-domain
    # resolution (Host header) and TRUSTED_PROXIES-gated scheme/host
    # detection see the real values, not this proxy's own.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
