; TASK-MVP-004B. Production PHP tuning - no Xdebug (never installed in
; Dockerfile.production), APP_DEBUG=false is enforced separately via .env,
; this file only tunes the PHP runtime itself.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
